name: Android Release (signed APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-release.yml"

jobs:
  build-signed:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keystore is supplied out-of-band as a base64 JKS in secrets.
      # It exists ONLY for the duration of this job — never committed.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See DEPLOYMENT.md → Android signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/civiclens-release.jks"

      - name: Create keystore properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/key.properties" <<EOF
          storeFile=$RUNNER_TEMP/civiclens-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Export web shell + sync Capacitor
        run: |
          mkdir -p mobile/www
          echo '<!doctype html><html><head><meta charset="utf-8"><title>CivicLens</title></head><body style="background:#081c2a;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><a href="/" style="color:#f59e0b">CivicLens — open dashboard</a></body></html>' > mobile/www/index.html
          bunx cap sync android

      - name: Assemble signed release APK + AAB
        env:
          # Gradle reads key.properties from android/ (copied from RUNNER_TEMP).
          CAPISSERVER: ""
        run: |
          cp "$RUNNER_TEMP/key.properties" android/key.properties
          cd android
          sh ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: civiclens-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: civiclens-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/civiclens-release.jks" "$RUNNER_TEMP/key.properties" android/key.properties
