name: Deploy Web (auto on main)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy web app
    runs-on: ubuntu-latest
    # Deployment happens automatically through the platform connected to this
    # repository (e.g. Vercel/Freebuff). If Vercel secrets are configured, we
    # also trigger an explicit deploy here for a verifiable pipeline.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Deploy to Vercel (optional — requires secrets)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "Vercel secrets not set — skipping explicit Vercel deploy."
            echo "Hosting (Freebuff/connected Git integration) deploys this repo automatically on push to main."
          fi
