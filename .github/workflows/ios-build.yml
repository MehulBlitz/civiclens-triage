name: iOS Build (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export web shell + sync Capacitor
        run: |
          mkdir -p mobile/www
          echo '<!doctype html><html><head><meta charset="utf-8"><title>CivicLens</title></head><body style="background:#081c2a;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><a href="/" style="color:#f59e0b">CivicLens — open dashboard</a></body></html>' > mobile/www/index.html
          bunx cap sync ios

      - name: Install CocoaPods deps (if needed)
        run: |
          if [ -d "ios/App/Pods" ]; then echo "Pods present"; else pod install --project-directory=ios/App; fi

      # Unsigned archive → IPA sideloadable via Xcode/devices with a
      # development identity. No Apple credentials required for this job.
      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Export unsigned IPA
        run: |
          cd ios/App
          mkdir -p output
          cat > ExportOptions-unsigned.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist>
            <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>stripSwiftSymbols</key><true/>
              <key>compileBitcode</key><false/>
            </dict>
          </plist>
          EOF
          if xcodebuild -exportArchive -archivePath build/App.xcarchive \
             -exportOptionsPlist ExportOptions-unsigned.plist \
             -exportPath output CODE_SIGNING_ALLOWED=NO; then
            echo "exportArchive produced IPA"
          else
            echo "exportArchive failed — packaging .app into Payload manually"
            rm -rf output/Payload
            mkdir -p output/Payload
            cp -R build/App.xcarchive/Products/Applications/*.app output/Payload/
            (cd output && zip -qry ../CivicLens-unsigned.ipa Payload)
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: civiclens-ios-unsigned-ipa
          path: ios/App/output/*.ipa
          if-no-files-found: error
          retention-days: 14

  # Signed IPA — activates ONLY when signing secrets exist, detected at the
  # step level (the only place the secrets context is reliable for gating).
  build-signed:
    name: Build signed IPA (secrets present)
    runs-on: macos-latest
    needs: build-ipa

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check signing secrets
        id: secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets not configured — skipping signed IPA job."
          fi

      - name: Decode signing certificate
        if: steps.secrets.outputs.available == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 -d > "$RUNNER_TEMP/civiclens.p12"
          security create-keychain -p cikeychain "$RUNNER_TEMP/ci.keychain"
          security import "$RUNNER_TEMP/civiclens.p12" -k "$RUNNER_TEMP/ci.keychain" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k cikeychain "$RUNNER_TEMP/ci.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain"

      - name: Decode provisioning profile
        if: steps.secrets.outputs.available == 'true'
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > /tmp/plist.xml && \
            /usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/plist.xml)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Export web shell + sync Capacitor
        if: steps.secrets.outputs.available == 'true'
        run: |
          mkdir -p mobile/www
          echo '<!doctype html><html><head><meta charset="utf-8"><title>CivicLens</title></head><body style="background:#081c2a;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh"><a href="/" style="color:#f59e0b">CivicLens — open dashboard</a></body></html>' > mobile/www/index.html
          bunx cap sync ios

      - name: Pod install
        if: steps.secrets.outputs.available == 'true'
        run: pod install --project-directory=ios/App

      - name: Archive (signed, manual profile)
        if: steps.secrets.outputs.available == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App-signed.xcarchive \
            archive CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID"

      - name: Export signed IPA
        if: steps.secrets.outputs.available == 'true'
        run: |
          cd ios/App
          mkdir -p output
          cat > ExportOptions-signed.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist>
            <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>stripSwiftSymbols</key><true/>
            </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App-signed.xcarchive \
            -exportOptionsPlist ExportOptions-signed.plist \
            -exportPath output

      - name: Upload signed IPA
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: civiclens-ios-signed-ipa
          path: ios/App/output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean secrets from runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain" || true
          rm -f "$RUNNER_TEMP/civiclens.p12" "$RUNNER_TEMP/profile.mobileprovision"
