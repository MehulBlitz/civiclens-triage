# ML Pipeline — BMC retrain
#
# 1. Build the BMC/Mumbai corpus (bmc_data.py), export the client lexicon
#    (export_bmc_lexicon.py), retrain every model (train.py etc.).
# 2. CI lint for the ML directory.
#
# Note: no repo access needed — corpus generation is self-contained.

name: ML Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "scripts/train-bmc.sh"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML deps
        run: pip install -r ml/requirements.txt

      - name: Build BMC corpus + client lexicon
        run: python ml/bmc_data.py --build && python ml/export_bmc_lexicon.py

      - name: Train triage SVM on the BMC-merged corpus
        run: python ml/train.py --per-category 150 --real-per-source 800

      - name: Training report
        if: always()
        run: cat ml/models/triage_metrics.json 2>/dev/null || true

      - name: Lint ML sources
        run: python -m compileall -q ml
