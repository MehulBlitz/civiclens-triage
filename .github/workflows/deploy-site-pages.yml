name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, fix/github-pages-css]
    paths: ["site/**", ".github/workflows/deploy-site-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Typecheck
        run: bun run typecheck
        working-directory: site
      - name: Build
        run: bun run build
        working-directory: site
        env:
          # Set this repository variable (Settings → Secrets and variables →
          # Actions → Variables) to the deployed ML service base URL, e.g.
          # https://civiclens-ml-production.up.railway.app — the site then
          # upgrades from the on-device lexicon to the live BMC-trained SVM.
          # Empty/unset ⇒ site builds in self-contained lexicon mode.
          VITE_ML_SERVICE_URL: ${{ vars.VITE_ML_SERVICE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
