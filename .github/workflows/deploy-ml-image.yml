name: Build & Push ML Image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/deploy-ml-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push civiclens-ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/Dockerfile
          push: true
          tags: |
            ghcr.io/mehulblitz/civiclens-ml:latest
            ghcr.io/mehulblitz/civiclens-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
